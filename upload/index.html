<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Uploader - CraXID Project</title>

  <meta name="description" content="GDrive Uploader CraXID Project. Upload file sementara (Auto-delete 24 Jam)." />
  <meta name="keywords" content="CraXID uploader, google drive uploader, file hosting sementara, bot whatsapp" />
  <meta name="author" content="CraXID Project" />
  <meta name="theme-color" content="#7C5CFF" />

  <link rel="canonical" href="/upload/" />
  <link rel="icon" href="https://github.com/craxid.png" />

  <meta property="og:type" content="website" />
  <meta property="og:title" content="Uploader - CraXID Project" />
  <meta property="og:description" content="Upload file sementara secara anonim" />
  <meta property="og:image" content="https://github.com/craxid.png" />
  <meta property="og:url" content="/upload/" />

  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Uploader - CraXID Project" />
  <meta name="twitter:description" content="Upload file sementara secara anonim." />
  <meta name="twitter:image" content="https://github.com/craxid.png" />

  <link rel="preconnect" href="https://cdnjs.cloudflare.com" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />

  <link rel="stylesheet" href="../style.css" />
  <link rel="manifest" href="../manifest.webmanifest" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="CraXID" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="apple-touch-icon" href="https://github.com/craxid.png" />
</head>
<body>
  <main class="page bot-page">
    <section class="content bot-content" aria-label="Uploader Page">
      <button id="themeToggle" class="theme-toggle" aria-label="Toggle theme"></button>

      <img id="profileImage" class="profile-img" alt="CraXID Profile" loading="lazy" />

      <h1 class="page-title">GDrive Uploader</h1>

      <p class="page-subtitle">
        Pilih atau seret file ke area di bawah ini. File akan diunggah ke Google Drive dan dihapus otomatis dalam 24 jam.
      </p>

      <div class="bot-actions">
        <div class="file-input-wrapper">
          <!--<input type="file" id="file" required>-->
          <input type="file" id="file" required style="opacity: 0; position: absolute; top: 0; left: 0; width: 100%; height: 100%; cursor: pointer; z-index: 2;">
          <div class="file-input-label liquid-glass" id="fileLabel">
            <i class="fa-solid fa-cloud-arrow-up icon-upload"></i>
            <span style="font-weight: 500;">Ketuk untuk memilih file</span>
          </div>
        </div>

        <button id="uploadBtn" class="global-btn primary-btn liquid-glass upload-action-btn">
          <i class="fa-solid fa-upload"></i>
          <span>Upload ke Drive</span>
        </button>

        <div id="status"></div>

        <a href="../" class="back-link" style="margin-top: 10px;">
          <i class="fa-solid fa-arrow-left"></i>
          <span>Kembali ke Home</span>
        </a>
      </div>
    </section>

    <footer>
      © <span id="year"></span> <span id="footerName"></span>. All rights reserved.
    </footer>
  </main>

  <script src="../config.js"></script>
  <script src="../script.js"></script>
</body>
</html>
