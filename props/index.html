<body>
  <main class="page bot-page">
    <section class="content bot-content" aria-label="Build.prop Generator">
      <button id="themeToggle" class="theme-toggle" aria-label="Toggle theme"></button>

      <img id="profileImage" class="profile-img" alt="CraXID Profile" loading="lazy" />

      <h1 class="page-title">Build.prop Generator</h1>

      <p class="page-subtitle">
        Isi detail perangkat di bawah ini untuk generate modul Magisk berisi build.prop custom.
      </p>

      <form id="propForm" class="prop-form">
        <div class="form-group">
          <label for="namaBrand">Nama Brand</label>
          <input type="text" id="namaBrand" class="form-input" autocomplete="off" required />
        </div>

        <div class="form-group">
          <label for="namaKode">Nama Kode (contoh: mido)</label>
          <input type="text" id="namaKode" class="form-input" autocomplete="off" required />
        </div>

        <div class="form-group">
          <label for="pembuat">Pembuat</label>
          <input type="text" id="pembuat" class="form-input" autocomplete="off" required />
        </div>

        <div class="form-group">
          <label for="model">Model</label>
          <input type="text" id="model" class="form-input" autocomplete="off" required />
        </div>

        <div class="form-group">
          <label for="versiAndroid">Versi Android (contoh: 12)</label>
          <input type="number" id="versiAndroid" class="form-input" min="1" required />
        </div>

        <div class="form-group">
          <label for="versiSDK">Versi SDK (contoh: 31)</label>
          <input type="number" id="versiSDK" class="form-input" min="1" required />
        </div>

        <div class="prop-form-actions">
          <button type="button" id="propPreviewBtn" class="global-btn secondary-btn liquid-glass">
            <i class="fa-solid fa-eye"></i>
            <span>Pratinjau</span>
          </button>

          <button type="submit" class="global-btn primary-btn liquid-glass">
            <i class="fa-solid fa-file-zipper"></i>
            <span>Generate build.prop ZIP</span>
          </button>
        </div>

        <div id="propPreview" class="prop-preview" hidden>
          <div class="prop-preview-head">
            <h3><i class="fa-solid fa-eye"></i> Pratinjau</h3>
            <button type="button" id="propPreviewClose" class="prop-preview-close" aria-label="Tutup pratinjau">
              <i class="fa-solid fa-xmark"></i>
            </button>
          </div>
          <div class="prop-preview-tabs" role="tablist">
            <button type="button" class="prop-preview-tab active" data-file="system">system.prop</button>
            <button type="button" class="prop-preview-tab" data-file="module">module.prop</button>
          </div>
          <pre id="propPreviewContent" class="prop-preview-content"></pre>
        </div>

        <div id="propStatus"></div>

        <a href="../" class="back-link">
          <i class="fa-solid fa-arrow-left"></i>
          <span>Kembali ke Home</span>
        </a>
      </form>
    </section>

    <footer>
      © <span id="year"></span> <span id="footerName"></span>. All rights reserved.
    </footer>
  </main>

  <script src="../config.js"></script>
  <script src="../script.js"></script>
</body>
