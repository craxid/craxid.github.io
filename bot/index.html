<body>
  <main class="page bot-page">
    <section class="content bot-content" aria-label="Bot Page">
      <button id="themeToggle" class="theme-toggle" aria-label="Toggle theme"></button>

      <img
        id="profileImage"
        class="profile-img"
        alt="CraXID Profile"
        loading="lazy"
      />

      <h1 class="page-title">CraXID Bot</h1>

      <p class="page-subtitle">
        Gabung ke grup bot untuk mendapatkan update, akses fitur, informasi command,
        dan diskusi seputar bot CraXID.
      </p>

      <div class="bot-actions">
        <a
          id="botGroupBtn"
          class="whatsapp-btn liquid-glass"
          target="_blank"
          rel="noopener"
        >
          <i class="fa-solid fa-robot"></i>
          <span>Gabung Grup Bot</span>
        </a>

        <!-- Jarak kutambahkan di baris ini -->
        <a href="../" class="back-link" style="margin-top: 10px;">
          <i class="fa-solid fa-arrow-left"></i>
          <span>Kembali ke Home</span>
        </a>
      </div>
    </section>

    <footer>
      © <span id="year"></span> <span id="footerName"></span>. All rights reserved.
    </footer>

  <script src="../config.js"></script>
  <script src="../script.js"></script>
