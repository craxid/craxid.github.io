<!DOCTYPE html>
<html lang="id" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reading... | Dede Kurniawan</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>
    <div class="container post-page">
        <main id="post-body" class="project-card" style="text-align:left; line-height:1.8;">
            <p>Memuat konten...</p>
        </main>

        <footer>
            © <span id="year"></span> <span id="footerName"></span>. All rights reserved.
        </footer>
    </div>

    <div class="post-dock liquid-glass">
        <button id="themeToggle" class="theme-toggle" aria-label="Toggle theme"></button>
        <a href="blog/" class="dock-back" aria-label="Kembali ke Blog">
            <i class="fa-solid fa-arrow-left"></i>
        </a>
    </div>

    <script src="config.js"></script>
    <script src="script.js"></script>
    <script>
        function parseFrontMatter(text) {
            const meta = {};
            let body = text;

            const match = text.match(/^---\r?\n([\s\S]*?)\r?\n---\r?\n?/);

            if (match) {
                body = text.slice(match[0].length);

                match[1].split(/\r?\n/).forEach((line) => {
                    const separator = line.indexOf(":");

                    if (separator === -1) {
                        return;
                    }

                    const key = line.slice(0, separator).trim();
                    let value = line.slice(separator + 1).trim();

                    if (value.startsWith("[") && value.endsWith("]")) {
                        value = value
                            .slice(1, -1)
                            .split(",")
                            .map((item) => item.trim())
                            .filter(Boolean);
                    }

                    if (key) {
                        meta[key] = value;
                    }
                });
            }

            return { meta, body };
        }

        function formatPostDate(dateString) {
            if (!dateString) {
                return "";
            }

            const date = new Date(dateString + "T00:00:00");

            if (Number.isNaN(date.getTime())) {
                return dateString;
            }

            return date.toLocaleDateString("id-ID", {
                day: "numeric",
                month: "long",
                year: "numeric",
            });
        }

        function escapeHtml(text) {
            return String(text)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;");
        }

        async function loadPost() {
            const params = new URLSearchParams(window.location.search);
            const file = params.get('file');
            const target = document.getElementById('post-body');

            if(!file || !/^[a-z0-9-]+$/i.test(file)) {
                target.innerHTML = "<h1>Artikel tidak ditemukan.</h1>";
                return;
            }

            try {
                const response = await fetch(`content/${file}.md`);
                if(!response.ok) throw new Error();
                const text = await response.text();
                const { meta, body } = parseFrontMatter(text);

                const title = meta.title || file.replace(/-/g, ' ');
                const date = formatPostDate(meta.date);
                const tags = Array.isArray(meta.tags) ? meta.tags : [];
                const authorName = (typeof CONFIG !== "undefined" && CONFIG.authorName) || "Dede Kurniawan";
                const authorAvatar = (typeof CONFIG !== "undefined" && CONFIG.profileImage) || "/icons/icon.webp";
                const readMins = Math.max(1, Math.ceil(body.split(/\s+/).filter(Boolean).length / 200));

                const authorHtml = `
                    <div class="post-author-card liquid-glass">
                        <div class="post-author">
                            <img class="post-author-avatar" src="${authorAvatar}" alt="${escapeHtml(authorName)}" loading="lazy">
                            <div>
                                <div class="post-author-name">${escapeHtml(authorName)} <i class="fa-solid fa-circle-check post-verified" aria-label="Terverifikasi"></i></div>
                                <div class="post-author-sub">${date ? escapeHtml(date) + " · " : ""}${readMins} mnt baca</div>
                            </div>
                        </div>
                    </div>
                `;

                const tagsHtml = tags.length ? `
                    <div class="post-meta">
                        ${tags.map((tag) => `<span class="post-tag"><i class="fa-solid fa-tag"></i> ${escapeHtml(tag)}</span>`).join("")}
                    </div>
                ` : "";

                target.innerHTML = `
                    <h1 class="post-title">${escapeHtml(title)}</h1>
                    ${authorHtml}
                    ${tagsHtml}
                    <div class="post-content">${marked.parse(body)}</div>
                `;
                document.title = `${title} | Blog`;

                // Tombol salin di setiap blok kode.
                // Pakai Clipboard API sehingga lolos proteksi anti-copas situs.
                target.querySelectorAll(".post-content pre").forEach((pre) => {
                    const codeEl = pre.querySelector("code");
                    // Bungkus pre agar tombol salin tidak ikut kegeser
                    // saat isi kode di-scroll horizontal
                    const wrap = document.createElement("div");
                    wrap.className = "code-block-wrap";
                    pre.replaceWith(wrap);
                    wrap.appendChild(pre);
                    const btn = document.createElement("button");
                    btn.type = "button";
                    btn.className = "code-copy-btn";
                    btn.setAttribute("aria-label", "Salin kode");
                    btn.innerHTML = '<i class="fa-solid fa-copy"></i><span>Salin</span>';
                    btn.addEventListener("click", async () => {
                        const text = (codeEl || pre).textContent;
                        try {
                            await navigator.clipboard.writeText(text);
                        } catch (err) {
                            const ta = document.createElement("textarea");
                            ta.value = text;
                            ta.setAttribute("readonly", "");
                            ta.style.position = "fixed";
                            ta.style.opacity = "0";
                            document.body.appendChild(ta);
                            ta.select();
                            try { document.execCommand("copy"); } catch (e) {}
                            ta.remove();
                        }
                        btn.classList.add("copied");
                        btn.innerHTML = '<i class="fa-solid fa-check"></i><span>Disalin!</span>';
                        setTimeout(() => {
                            btn.classList.remove("copied");
                            btn.innerHTML = '<i class="fa-solid fa-copy"></i><span>Salin</span>';
                        }, 1600);
                    });
                    wrap.appendChild(btn);
                });
            } catch (e) {
                target.innerHTML = "<h1>Gagal memuat artikel.</h1>";
            }
        }
        loadPost();
    </script>
</body>
</html>
